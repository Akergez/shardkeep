stages:
  - build

variables:
  GRADLE_USER_HOME: "$CI_PROJECT_DIR/.gradle"
  ANDROID_HOME: "$CI_PROJECT_DIR/.android-sdk"

.gradle_cache: &gradle_cache
  cache:
    key: "$CI_COMMIT_REF_SLUG"
    paths:
      - .gradle/caches
      - .gradle/wrapper
    policy: pull-push

.build_rules: &build_rules
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

build:android:
  stage: build
  image: eclipse-temurin:21-jdk
  <<: [*gradle_cache, *build_rules]
  before_script:
    - apt-get update && apt-get install -y wget unzip
    - |
      if [ ! -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
        mkdir -p "$ANDROID_HOME/cmdline-tools"
        wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O cmdline-tools.zip
        unzip -q cmdline-tools.zip -d "$ANDROID_HOME/cmdline-tools"
        mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
      fi
    - export PATH="$PATH:$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools"
    - yes | sdkmanager --licenses || true
    - sdkmanager "platforms;android-36" "build-tools;36.0.0"
    - test -n "$ANDROID_KEYSTORE_BASE64"
    - test -n "$KEYSTORE_PASSWORD"
    - test -n "$KEY_ALIAS"
    - test -n "$KEY_PASSWORD"
    - echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$CI_PROJECT_DIR/release.keystore"
    - export KEYSTORE_PATH="$CI_PROJECT_DIR/release.keystore"
  script:
    - ./gradlew --no-daemon :androidApp:assembleRelease
    - $ANDROID_HOME/build-tools/36.0.0/apksigner verify --verbose --print-certs androidApp/build/outputs/apk/release/*.apk
  artifacts:
    paths:
      - androidApp/build/outputs/apk/release/*.apk
    expire_in: 1 week

build:linux-x86_64:
  stage: build
  image: eclipse-temurin:21-jdk
  <<: [*gradle_cache, *build_rules]
  before_script:
    - apt-get update && apt-get install -y fakeroot
  script:
    - ./gradlew --no-daemon :desktopApp:packageDeb
  artifacts:
    paths:
      - desktopApp/build/compose/binaries/main/deb/*.deb
    expire_in: 1 week

build:linux-arm64:
  stage: build
  image: eclipse-temurin:21-jdk
  tags:
    - saas-linux-small-arm64
  <<: [*gradle_cache, *build_rules]
  before_script:
    - apt-get update && apt-get install -y fakeroot
  script:
    - ./gradlew --no-daemon :desktopApp:packageDeb
  artifacts:
    paths:
      - desktopApp/build/compose/binaries/main/deb/*.deb
    expire_in: 1 week

build:macos-arm64:
  stage: build
  tags:
    - macos-arm64
  <<: [*gradle_cache, *build_rules]
  before_script:
    - export JAVA_HOME=$(/usr/libexec/java_home -v 21)
  script:
    - ./gradlew --no-daemon :desktopApp:createDistributable
    - |
      APP_BUNDLE=$(find desktopApp/build/compose/binaries/main/app -maxdepth 1 -name '*.app' -print -quit)
      test -n "$APP_BUNDLE"
      mkdir -p desktopApp/build/compose/binaries/main/dmg
      hdiutil create -volname "Shardkeep" -srcfolder "$APP_BUNDLE" -ov -format UDZO desktopApp/build/compose/binaries/main/dmg/Shardkeep-1.0.0.dmg
  artifacts:
    paths:
      - desktopApp/build/compose/binaries/main/dmg/*.dmg
    expire_in: 1 week
