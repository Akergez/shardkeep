stages:
  - build
  - package
  - release

workflow:
  rules:
    - if: $CI_COMMIT_TAG
    - when: never

variables:
  GRADLE_USER_HOME: "$CI_PROJECT_DIR/.gradle"
  ANDROID_HOME: "$CI_PROJECT_DIR/.android-sdk"

.gradle_cache: &gradle_cache
  cache:
    key: "$CI_COMMIT_REF_SLUG"
    paths:
      - .gradle/caches
      - .gradle/wrapper
    policy: pull-push

.tag_rules: &tag_rules
  rules:
    - if: $CI_COMMIT_TAG

build:android:
  stage: build
  image: eclipse-temurin:21-jdk
  <<: [*gradle_cache, *tag_rules]
  before_script:
    - apt-get update && apt-get install -y wget unzip
    - |
      if [ ! -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
        mkdir -p "$ANDROID_HOME/cmdline-tools"
        wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O cmdline-tools.zip
        unzip -q cmdline-tools.zip -d "$ANDROID_HOME/cmdline-tools"
        mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
      fi
    - export PATH="$PATH:$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools"
    - yes | sdkmanager --licenses || true
    - sdkmanager "platforms;android-36" "build-tools;36.0.0"
    - test -n "$ANDROID_KEYSTORE_BASE64"
    - test -n "$KEYSTORE_PASSWORD"
    - test -n "$KEY_ALIAS"
    - test -n "$KEY_PASSWORD"
    - echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$CI_PROJECT_DIR/release.keystore"
    - export KEYSTORE_PATH="$CI_PROJECT_DIR/release.keystore"
  script:
    - ./gradlew --no-daemon :androidApp:assembleRelease
    - $ANDROID_HOME/build-tools/36.0.0/apksigner verify --verbose --print-certs androidApp/build/outputs/apk/release/*.apk
  artifacts:
    paths:
      - androidApp/build/outputs/apk/release/*.apk
    expire_in: 1 week

build:linux-x86_64:
  stage: build
  image: eclipse-temurin:21-jdk
  <<: [*gradle_cache, *tag_rules]
  before_script:
    - apt-get update && apt-get install -y fakeroot
  script:
    - ./gradlew --no-daemon :desktopApp:packageDeb
  artifacts:
    paths:
      - desktopApp/build/compose/binaries/main/deb/*.deb
    expire_in: 1 week

build:linux-arm64:
  stage: build
  image: eclipse-temurin:21-jdk
  tags:
    - saas-linux-small-arm64
  <<: [*gradle_cache, *tag_rules]
  before_script:
    - apt-get update && apt-get install -y fakeroot
  script:
    - ./gradlew --no-daemon :desktopApp:packageDeb
  artifacts:
    paths:
      - desktopApp/build/compose/binaries/main/deb/*.deb
    expire_in: 1 week

build:macos-arm64:
  stage: build
  tags:
    - macos-arm64
  <<: [*gradle_cache, *tag_rules]
  before_script:
    - |
      curl -L -o jdk.tar.gz \
        https://github.com/adoptium/temurin21-binaries/releases/download/jdk-21.0.5%2B11/OpenJDK21U-jdk_aarch64_mac_hotspot_21.0.5_11.tar.gz
      mkdir -p "$CI_PROJECT_DIR/.jdk"
      tar -xzf jdk.tar.gz --strip-components=1 -C "$CI_PROJECT_DIR/.jdk"
    - export JAVA_HOME="$CI_PROJECT_DIR/.jdk/Contents/Home"
    - export PATH="$JAVA_HOME/bin:$PATH"
    - java -version
    - test "$(java -XshowSettings:properties -version 2>&1 | awk '/java.specification.version/ { print $3 }')" = "21"
  script:
    - ./gradlew --no-daemon :desktopApp:createDistributable
    - |
      APP_BUNDLE=$(find desktopApp/build/compose/binaries/main/app -maxdepth 1 -name '*.app' -print -quit)
      test -n "$APP_BUNDLE"
      STAGING=$(mktemp -d)
      ditto "$APP_BUNDLE" "$STAGING/$(basename "$APP_BUNDLE")"
      ln -s /Applications "$STAGING/Applications"
      mkdir -p desktopApp/build/compose/binaries/main/dmg
      hdiutil create -volname "Shardkeep" -srcfolder "$STAGING" -ov -format UDZO desktopApp/build/compose/binaries/main/dmg/Shardkeep-1.0.0.dmg
  artifacts:
    paths:
      - desktopApp/build/compose/binaries/main/dmg/*.dmg
    expire_in: 1 week

package:publish:
  stage: package
  image: curlimages/curl:latest
  needs:
    - job: build:android
      artifacts: true
    - job: build:linux-x86_64
      artifacts: true
    - job: build:linux-arm64
      artifacts: true
    - job: build:macos-arm64
      artifacts: true
  script:
    - PACKAGE_URL="${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/shardkeep/${CI_COMMIT_TAG}"
    - |
      APK=$(find androidApp/build/outputs/apk/release -name '*.apk' -type f -print -quit)
      test -n "$APK"
      curl --fail --header "JOB-TOKEN: ${CI_JOB_TOKEN}" --upload-file "$APK" "${PACKAGE_URL}/Shardkeep-${CI_COMMIT_TAG}.apk"
    - |
      for file in desktopApp/build/compose/binaries/main/deb/*.deb; do
        case "$(basename "$file")" in
          *amd64*) arch="x86_64" ;;
          *arm64*|*aarch64*) arch="arm64" ;;
          *) echo "Unknown DEB architecture: $file"; exit 1 ;;
        esac
        curl --fail --header "JOB-TOKEN: ${CI_JOB_TOKEN}" --upload-file "$file" "${PACKAGE_URL}/Shardkeep-${CI_COMMIT_TAG}-linux-${arch}.deb"
      done
    - |
      DMG=$(find desktopApp/build/compose/binaries/main/dmg -name '*.dmg' -type f -print -quit)
      test -n "$DMG"
      curl --fail --header "JOB-TOKEN: ${CI_JOB_TOKEN}" --upload-file "$DMG" "${PACKAGE_URL}/Shardkeep-${CI_COMMIT_TAG}-macOS-arm64.dmg"
  <<: *tag_rules

release:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:v0.24.0
  needs:
    - job: package:publish
  script:
    - echo "Creating Shardkeep release ${CI_COMMIT_TAG}"
  release:
    tag_name: $CI_COMMIT_TAG
    name: "Shardkeep ${CI_COMMIT_TAG}"
    description: |
      ## Downloads
      - Android APK
      - Linux DEB (x86_64)
      - Linux DEB (arm64)
      - macOS DMG (arm64)
    assets:
      links:
        - name: "Android APK"
          url: "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/shardkeep/${CI_COMMIT_TAG}/Shardkeep-${CI_COMMIT_TAG}.apk"
          link_type: package
        - name: "Linux DEB (x86_64)"
          url: "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/shardkeep/${CI_COMMIT_TAG}/Shardkeep-${CI_COMMIT_TAG}-linux-x86_64.deb"
          link_type: package
        - name: "Linux DEB (arm64)"
          url: "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/shardkeep/${CI_COMMIT_TAG}/Shardkeep-${CI_COMMIT_TAG}-linux-arm64.deb"
          link_type: package
        - name: "macOS DMG (arm64)"
          url: "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/shardkeep/${CI_COMMIT_TAG}/Shardkeep-${CI_COMMIT_TAG}-macOS-arm64.dmg"
          link_type: package
  <<: *tag_rules
