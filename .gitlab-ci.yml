stages:
  - build
  - package
  - release

workflow:
  rules:
    - if: $CI_COMMIT_TAG
    - when: never

variables:
  GRADLE_USER_HOME: "$CI_PROJECT_DIR/.gradle"
  ANDROID_HOME: "$CI_PROJECT_DIR/.android-sdk"

.gradle_cache: &gradle_cache
  cache:
    key: "$CI_COMMIT_REF_SLUG"
    paths:
      - .gradle/caches
      - .gradle/wrapper
    policy: pull-push

.tag_rules: &tag_rules
  rules:
    - if: $CI_COMMIT_TAG

build:android:
  stage: build
  image: eclipse-temurin:21-jdk
  <<: [*gradle_cache, *tag_rules]
  before_script:
    - apt-get update && apt-get install -y wget unzip
    - |
      if [ ! -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
        mkdir -p "$ANDROID_HOME/cmdline-tools"
        wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O cmdline-tools.zip
        unzip -q cmdline-tools.zip -d "$ANDROID_HOME/cmdline-tools"
        mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
      fi
    - export PATH="$PATH:$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools"
    - yes | sdkmanager --licenses || true
    - sdkmanager "platforms;android-36" "build-tools;36.0.0"
    - test -n "$ANDROID_KEYSTORE_BASE64"
    - test -n "$KEYSTORE_PASSWORD"
    - test -n "$KEY_ALIAS"
    - test -n "$KEY_PASSWORD"
    - echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$CI_PROJECT_DIR/release.keystore"
    - export KEYSTORE_PATH="$CI_PROJECT_DIR/release.keystore"
  script:
    - ./gradlew --no-daemon :androidApp:assembleRelease
    - $ANDROID_HOME/build-tools/36.0.0/apksigner verify --verbose --print-certs androidApp/build/outputs/apk/release/*.apk
  artifacts:
    paths:
      - androidApp/build/outputs/apk/release/*.apk
    expire_in: 1 week

build:linux-x86_64:
  stage: build
  image: eclipse-temurin:21-jdk
  <<: [*gradle_cache, *tag_rules]
  before_script:
    - apt-get update && apt-get install -y rpm
  script:
    - ./gradlew --no-daemon :desktopApp:packageRpm
  artifacts:
    paths:
      - desktopApp/build/compose/binaries/main/rpm/*.rpm
    expire_in: 1 week

build:linux-arm64:
  stage: build
  image: eclipse-temurin:21-jdk
  tags:
    - saas-linux-small-arm64
  <<: [*gradle_cache, *tag_rules]
  before_script:
    - apt-get update && apt-get install -y rpm
  script:
    - ./gradlew --no-daemon :desktopApp:packageRpm
  artifacts:
    paths:
      - desktopApp/build/compose/binaries/main/rpm/*.rpm
    expire_in: 1 week

build:macos-arm64:
  stage: build
  tags:
    - macos-arm64
  <<: [*gradle_cache, *tag_rules]
  before_script:
    - |
      curl -L -o jdk.tar.gz \
        https://github.com/adoptium/temurin21-binaries/releases/download/jdk-21.0.5%2B11/OpenJDK21U-jdk_aarch64_mac_hotspot_21.0.5_11.tar.gz
      mkdir -p "$CI_PROJECT_DIR/.jdk"
      tar -xzf jdk.tar.gz --strip-components=1 -C "$CI_PROJECT_DIR/.jdk"
    - export JAVA_HOME="$CI_PROJECT_DIR/.jdk/Contents/Home"
    - export PATH="$JAVA_HOME/bin:$PATH"
    - java -version
    - test "$(java -XshowSettings:properties -version 2>&1 | awk '/java.specification.version/ { print $3 }')" = "21"
  script:
    - ./gradlew --no-daemon :desktopApp:createDistributable
    - |
      APP_BUNDLE=$(find desktopApp/build/compose/binaries/main/app -maxdepth 1 -name '*.app' -print -quit)
      test -n "$APP_BUNDLE"
      STAGING=$(mktemp -d)
      ditto "$APP_BUNDLE" "$STAGING/$(basename "$APP_BUNDLE")"
      ln -s /Applications "$STAGING/Applications"
      mkdir -p desktopApp/build/compose/binaries/main/dmg
      hdiutil create -volname "Shardkeep" -srcfolder "$STAGING" -ov -format UDZO "desktopApp/build/compose/binaries/main/dmg/Shardkeep-${CI_COMMIT_TAG}.dmg"
  artifacts:
    paths:
      - desktopApp/build/compose/binaries/main/dmg/*.dmg
    expire_in: 1 week

# Windows-инсталлятор собирается здесь же, на Linux, чтобы не платить за
# windows-раннер. Пакует его pinpit, а не jpackage: jpackage кросс-компиляцию
# объявил non-goal и работает только на целевой ОС. pinpit скачивает Windows JDK
# сам, собирает из него рантайм через jlink (jlink кросс-платформенный), а WiX
# гоняет под Wine.
#
# Wine берётся из штатного репозитория дистрибутива, а не с dl.winehq.org: пакет
# оттуда ставится в /opt/wine-stable, куда pinpit и обращается по абсолютному
# пути, поэтому дистрибутивный /usr/bin/wine доводится симлинками. mono-complete
# нужен потому, что candle.exe и light.exe из WiX — это .NET.
#
# --no-configuration-cache обязателен: pinpit форкнут от Compose plugin 1.2.1 и
# на configuration cache падает с "property 'jdk' has no value".
build:windows-x86_64:
  stage: build
  image: eclipse-temurin:21-jdk
  <<: *tag_rules
  # pinpit держит скачанный Windows JDK в $HOME/.pinpit, а закэшировать GitLab
  # умеет только пути внутри проекта — отсюда подменённый HOME.
  cache:
    key: "$CI_COMMIT_REF_SLUG"
    paths:
      - .gradle/caches
      - .gradle/wrapper
      - .pinpit
    policy: pull-push
  variables:
    WINEDEBUG: "-all"
    HOME: "$CI_PROJECT_DIR"
  before_script:
    - dpkg --add-architecture i386
    - apt-get update
    - apt-get install -y --no-install-recommends wine wine32 wine64 mono-complete
    - mkdir -p /opt/wine-stable/bin
    - ln -sf /usr/bin/wine /opt/wine-stable/bin/wine
    - ln -sf /usr/bin/winepath /opt/wine-stable/bin/winepath
    - ln -sf /usr/bin/wineserver /opt/wine-stable/bin/wineserver
  script:
    - ./gradlew --no-daemon --no-configuration-cache :desktopApp:pinpitPackageDefaultMsiX64
  artifacts:
    paths:
      - desktopApp/build/pinpit/binaries/main-default/windows/x64/msi/*.msi
    expire_in: 1 week

package:publish:
  stage: package
  image: curlimages/curl:latest
  needs:
    - job: build:android
      artifacts: true
    - job: build:linux-x86_64
      artifacts: true
    - job: build:linux-arm64
      artifacts: true
    - job: build:macos-arm64
      artifacts: true
    - job: build:windows-x86_64
      artifacts: true
  script:
    - PACKAGE_URL="${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/shardkeep/${CI_COMMIT_TAG}"
    - |
      APK=$(find androidApp/build/outputs/apk/release -name '*.apk' -type f -print -quit)
      test -n "$APK"
      curl --fail --header "JOB-TOKEN: ${CI_JOB_TOKEN}" --upload-file "$APK" "${PACKAGE_URL}/Shardkeep-${CI_COMMIT_TAG}.apk"
    - |
      for file in desktopApp/build/compose/binaries/main/rpm/*.rpm; do
        case "$(basename "$file")" in
          *x86_64*) arch="x86_64" ;;
          *arm64*|*aarch64*) arch="arm64" ;;
          *) echo "Unknown RPM architecture: $file"; exit 1 ;;
        esac
        curl --fail --header "JOB-TOKEN: ${CI_JOB_TOKEN}" --upload-file "$file" "${PACKAGE_URL}/Shardkeep-${CI_COMMIT_TAG}-linux-${arch}.rpm"
      done
    - |
      DMG=$(find desktopApp/build/compose/binaries/main/dmg -name '*.dmg' -type f -print -quit)
      test -n "$DMG"
      curl --fail --header "JOB-TOKEN: ${CI_JOB_TOKEN}" --upload-file "$DMG" "${PACKAGE_URL}/Shardkeep-${CI_COMMIT_TAG}-macOS-arm64.dmg"
    - |
      MSI=$(find desktopApp/build/pinpit/binaries/main-default/windows/x64/msi -name '*.msi' -type f -print -quit)
      test -n "$MSI"
      curl --fail --header "JOB-TOKEN: ${CI_JOB_TOKEN}" --upload-file "$MSI" "${PACKAGE_URL}/Shardkeep-${CI_COMMIT_TAG}-windows-x86_64.msi"
  <<: *tag_rules

release:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:v0.24.0
  needs:
    - job: package:publish
  script:
    - echo "Creating Shardkeep release ${CI_COMMIT_TAG}"
  release:
    tag_name: $CI_COMMIT_TAG
    name: "Shardkeep ${CI_COMMIT_TAG}"
    description: |
      ## Downloads
      - Android APK
      - Linux RPM (x86_64)
      - Linux RPM (arm64)
      - macOS DMG (arm64)
      - Windows MSI (x86_64)
    assets:
      links:
        - name: "Android APK"
          url: "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/shardkeep/${CI_COMMIT_TAG}/Shardkeep-${CI_COMMIT_TAG}.apk"
          link_type: package
        - name: "Linux RPM (x86_64)"
          url: "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/shardkeep/${CI_COMMIT_TAG}/Shardkeep-${CI_COMMIT_TAG}-linux-x86_64.rpm"
          link_type: package
        - name: "Linux RPM (arm64)"
          url: "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/shardkeep/${CI_COMMIT_TAG}/Shardkeep-${CI_COMMIT_TAG}-linux-arm64.rpm"
          link_type: package
        - name: "macOS DMG (arm64)"
          url: "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/shardkeep/${CI_COMMIT_TAG}/Shardkeep-${CI_COMMIT_TAG}-macOS-arm64.dmg"
          link_type: package
        - name: "Windows MSI (x86_64)"
          url: "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/shardkeep/${CI_COMMIT_TAG}/Shardkeep-${CI_COMMIT_TAG}-windows-x86_64.msi"
          link_type: package
  <<: *tag_rules
